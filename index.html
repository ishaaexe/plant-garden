<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Smart Garden</title> <style> body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; } label { display: block; margin-top: 12px; font-weight: bold; } input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; } button { margin-top: 18px; padding: 10px 16px; background: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 16px; } #result { margin-top: 20px; padding: 12px; background: #e8f5e9; border-radius: 6px; display: none; } </style> </head> <body> <h1>Smart Garden 🌱</h1> <p>Tell us about your space.</p>

<label>Length (cm)</label>
<input type="number" id="length" placeholder="e.g. 150">

<label>Breadth (cm)</label>
<input type="number" id="breadth" placeholder="e.g. 60">

<label>Area type</label>
<select id="areaType">
<option value="balcony">Balcony</option>
<option value="rooftop">Rooftop</option>
<option value="indoor">Indoor</option>
</select>

<label>Sunlight per day (hours)</label>
<input type="number" id="sunHours" placeholder="e.g. 5">

<button onclick="showInputs()">Get recommendation</button>

<div id="result"></div> <script> function showInputs() { var length = document.getElementById("length").value; var breadth = document.getElementById("breadth").value; var areaType = document.getElementById("areaType").value; var sunHours = document.getElementById("sunHours").value; var box = document.getElementById("result"); box.style.display = "block"; box.innerHTML = "Space: " + length + " x " + breadth + " cm<br>" + "Area: " + areaType + "<br>" + "Sunlight: " + sunHours + " hours"; } </script> </body> </html>
