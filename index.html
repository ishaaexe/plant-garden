<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Smart Garden</title> <style> body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 15px; } label { display: block; margin-top: 12px; font-weight: bold; } input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; } button { margin-top: 14px; padding: 10px 16px; background: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 16px; } button.small { padding: 6px 10px; font-size: 14px; margin-top: 6px; } button.grey { background: #757575; } .box { margin-top: 16px; padding: 12px; border-radius: 6px; line-height: 1.6; } #result { background: #e8f5e9; display: none; } .section { display: none; margin-top: 28px; border-top: 2px solid #ccc; padding-top: 8px; } #readings { background: #e3f2fd; } #pump { background: #f3e5f5; } #harvest { background: #fff8e1; } .alert { background: #ffebee; border-left: 5px solid #c62828; } .notice { background: #fff3e0; border-left: 5px solid #ef6c00; } .info { background: #e8f5e9; border-left: 5px solid #2e7d32; } .best { font-size: 20px; font-weight: bold; color: #1b5e20; } .limits { font-size: 14px; color: #444; margin-top: 8px; } .small { font-size: 13px; color: #666; } </style> </head> <body> <h1>Smart Garden 🌱</h1> <p>Tell us about your space.</p>

<label>Length (cm)</label>
<input type="number" id="length" placeholder="e.g. 150">

<label>Breadth (cm)</label>
<input type="number" id="breadth" placeholder="e.g. 60">

<label>Area type</label>
<select id="areaType">
<option value="balcony">Balcony</option>
<option value="rooftop">Rooftop</option>
<option value="indoor">Indoor</option>
</select>

<label>Sunlight per day (hours)</label>
<input type="number" id="sunHours" placeholder="e.g. 6">

<button onclick="recommend()">Get recommendation</button>

<div id="result" class="box"></div> <div id="live" class="section"> <h2>Live plant monitor</h2> <div id="readings" class="box">Waiting for data...</div> <p class="small" id="updated"></p>
<h2>Alerts</h2>
<div id="alerts"></div>

<h2>Auto watering (simulation)</h2>
<div id="pump" class="box"></div>
<button class="small grey" onclick="resetWaterTest()">Reset watering test</button>

<h2>Harvest tracker</h2>
<div id="harvest" class="box">
  <label style="margin-top:0">Planting date</label>
  <input type="date" id="plantDate">
  <button class="small" onclick="savePlantDate()">Save date</button>
  <div id="harvestStatus" style="margin-top:10px"></div>
</div>
</div> <script> var CHANNEL_ID = "3519487"; var SAFETY = { stopAtPercent: 90, maxRunSeconds: 20, minGapHours: 6, offlineMinutes: 10, hotTempC: 32, hotFactor: 0.85 }; var ranked = []; var selectedPlant = null; var timer = null; var harvestAlert = null; function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } } function remove(k) { try { localStorage.removeItem(k); } catch (e) {} } function score(plant, input) { if (!plant.areaTypes.includes(input.areaType)) return -1; var area = input.length * input.breadth; if (area < plant.minSpaceCm2) return -1; var s = 10; var max = plant.sunHoursMax; if (input.sunHours >= plant.sunHoursMin && (max === null || input.sunHours <= max)) { if (max === null) { s += 50; } else { s += 50 - 5 * Math.abs(input.sunHours - (plant.sunHoursMin + max) / 2); } } else { var gap = input.sunHours < plant.sunHoursMin ? plant.sunHoursMin - input.sunHours : input.sunHours - max; if (gap <= 1) s += 20; else if (gap <= 2) s += 5; else return -1; } s += 20 * Math.min(1, plant.minSpaceCm2 / area); s -= (plant.lowConfidence ? plant.lowConfidence.length : 0) * 0.5; return Math.round(s * 10) / 10; } function recommend() { var input = { length: Number(document.getElementById("length").value), breadth: Number(document.getElementById("breadth").value), areaType: document.getElementById("areaType").value, sunHours: Number(document.getElementById("sunHours").value) }; var box = document.getElementById("result"); box.style.display = "block"; if (!(input.length > 0) || !(input.breadth > 0) || !(input.sunHours >= 0) || document.getElementById("sunHours").value === "") { box.innerHTML = "Please fill in all four boxes with numbers."; return; } fetch("plants-v2.json") .then(function (r) { return r.json(); }) .then(function (plants) { ranked = plants .map(function (p) { return { plant: p, score: score(p, input) }; }) .filter(function (x) { return x.score >= 0; }) .sort(function (a, b) { return b.score - a.score; }); if (ranked.length === 0) { box.innerHTML = "No plant fits this space. Try a bigger area or a different area type."; document.getElementById("live").style.display = "none"; selectedPlant = null; if (timer) { clearInterval(timer); timer = null; } return; } choosePlant(0); }) .catch(function (err) { box.innerHTML = "Something went wrong: " + err.message + ". Check that plants-v2.json exists in your repo and has no typing errors."; }); } function choosePlant(i) { selectedPlant = ranked[i].plant; var p = selectedPlant; var box = document.getElementById("result"); var conf = (p.lowConfidence && p.lowConfidence.length > 0) ? p.lowConfidence.length + " value(s) are estimates" : "All values verified"; var tempText = (p.tempIdealMin !== null && p.tempIdealMax !== null) ? p.tempIdealMin + " to " + p.tempIdealMax + " °C" : "no reliable range found"; var days = (p.daysToHarvestMin !== null) ? p.daysToHarvestMin + " to " + p.daysToHarvestMax + " days from " + p.daysCountFrom : "no fixed day count, see harvest tips"; var html = (i === 0 ? "Best match:<br>" : "Selected plant:<br>") + "<span class='best'>" + p.name + "</span> (score " + ranked[i].score + ")" + "<div class='limits'>" + "Water when soil moisture is below " + p.waterTriggerPercent + " %<br>" + "Ideal temperature: " + tempText + "<br>" + "Sunlight: " + p.sunHoursMin + (p.sunHoursMax !== null ? " to " + p.sunHoursMax : "+") + " hours<br>" + "Time to harvest: " + days + "<br>" + "Data check: " + conf + "<br>" + "Sources: " + p.sources.join(", ") + "</div>"; if (ranked.length > 1) { html += "<br>Other options:<br>"; for (var j = 0; j < Math.min(ranked.length, 4); j++) { if (j === i) continue; html += ranked[j].plant.name + " (score " + ranked[j].score + ") " + "<button class='small' onclick='choosePlant(" + j + ")'>Use this plant</button><br>"; } } box.innerHTML = html; box.style.display = "block"; document.getElementById("live").style.display = "block"; var saved = load("planted_" + p.name); document.getElementById("plantDate").value = saved ? saved : ""; updateHarvest(); loadLive(); if (timer) clearInterval(timer); timer = setInterval(loadLive, 15000); } function savePlantDate() { if (!selectedPlant) return; var v = document.getElementById("plantDate").value; if (v) { store("planted_" + selectedPlant.name, v); } updateHarvest(); loadLive(); } function updateHarvest() { harvestAlert = null; var out = document.getElementById("harvestStatus"); var p = selectedPlant; if (!p) return; var v = load("planted_" + p.name); if (!v) { out.innerHTML = "Enter the planting date to get harvest reminders.<br><br><b>Ripeness tips:</b> " + p.harvestHint; return; } var start = new Date(v + "T00:00:00"); var day = Math.floor((new Date() - start) / 86400000); var msg = "Day " + day + " since planting.<br>"; if (p.daysToHarvestMin === null) { msg += "This plant has no fixed day count. Check it by size, as described below."; harvestAlert = null; } else if (day < p.daysToHarvestMin) { msg += "Harvest window opens in " + (p.daysToHarvestMin - day) + " days (day " + p.daysToHarvestMin + " to " + p.daysToHarvestMax + ", counted from " + p.daysCountFrom + ")."; } else if (day <= p.daysToHarvestMax) { msg += "<b>Harvest window is open.</b> Check ripeness now."; harvestAlert = "Harvest window is open for " + p.name + " (day " + day + "). Check ripeness."; } else { msg += "<b>Past the usual window</b> (day " + p.daysToHarvestMax + "). Check the plant now and pick if ready."; harvestAlert = p.name + " is past the usual harvest window. Check and pick if ready."; } out.innerHTML = msg + "<br><br><b>Ripeness tips:</b> " + p.harvestHint; } function num(v) { return (v === null || v === undefined || v === "") ? null : Number(v); } function resetWaterTest() { remove("lastWater"); loadLive(); } function loadLive() { if (!selectedPlant) return; var url = "https://api.thingspeak.com/channels/" + CHANNEL_ID + "/feeds/last.json"; fetch(url) .then(function (r) { return r.json(); }) .then(function (d) { if (!d || !d.created_at) { document.getElementById("readings").innerHTML = "No sensor data yet."; return; } var moisture = num(d.field1); var temp = num(d.field2); var humidity = num(d.field3); var n = num(d.field4), ph = num(d.field5), k = num(d.field6); var p = selectedPlant; var now = new Date(); var created = new Date(d.created_at); var ageMin = Math.round((now - created) / 60000); var offline = ageMin > SAFETY.offlineMinutes; var npkText = (n === null && ph === null && k === null) ? "waiting for NPK sensor" : n + " / " + ph + " / " + k + " mg/kg"; document.getElementById("readings").innerHTML = "Soil moisture: " + moisture + " % (calibrated: 0 = dry, 100 = soaked)<br>" + "Temperature: " + temp + " °C<br>" + "Humidity: " + humidity + " %<br>" + "N / P / K: " + npkText; document.getElementById("updated").innerHTML = "Last sensor update: " + created.toLocaleString() + " (" + ageMin + " min ago). Page refreshes every 15 seconds."; var dep = p.depletion; var hot = (temp !== null && temp >= SAFETY.hotTempC); if (hot) dep = dep * SAFETY.hotFactor; var trigger = Math.round((1 - dep) * 100); var pumpMsg = ""; var pumpOn = false; if (moisture === null) { pumpMsg = "No moisture reading. Pump stays OFF."; } else if (offline) { pumpMsg = "Sensor data is old. Pump stays OFF for safety."; } else if (moisture >= SAFETY.stopAtPercent) { pumpMsg = "Soil moisture is high enough. Pump OFF."; } else if (moisture < trigger) { var last = load("lastWater"); var hoursAgo = last ? (now - new Date(last)) / 3600000 : null; if (last && hoursAgo < SAFETY.minGapHours) { pumpMsg = "Soil is dry, but the pump ran " + hoursAgo.toFixed(1) + " hours ago. Waiting (minimum gap " + SAFETY.minGapHours + " hours). Pump OFF."; } else { pumpOn = true; store("lastWater", now.toISOString()); pumpMsg = "<b>Pump ON</b> for up to " + SAFETY.maxRunSeconds + " seconds, or until moisture reaches " + SAFETY.stopAtPercent + " %."; } } else { pumpMsg = "Moisture is in the good range. Pump OFF."; } document.getElementById("pump").innerHTML = pumpMsg + "<br><br><span class='small'>Water trigger now: below " + trigger + " %" + (hot ? " (raised for hot weather, FAO-56 advice)" : "") + ".<br>Safety limits: stop at " + SAFETY.stopAtPercent + " %, max run " + SAFETY.maxRunSeconds + " s, min gap " + SAFETY.minGapHours + " h, pump off if data is older than " + SAFETY.offlineMinutes + " min. This is a simulation. The ESP will run the same rules.</span>"; var alerts = []; if (offline) alerts.push(["alert", "Sensor has not sent data for " + ageMin + " minutes. Check power and WiFi."]); if (moisture !== null && moisture < trigger) { alerts.push(["alert", "💧 Watering needed. Soil is at " + moisture + " %, limit is " + trigger + " %."]); } if (moisture !== null && moisture > 100) { alerts.push(["notice", "Moisture is above 100 %. Recalibrate the soil sensor."]); } if (temp !== null) { if (p.tempLimitMax !== null && temp > p.tempLimitMax) { alerts.push(["alert", "🌡️ Too hot for " + p.name + " (" + temp + " °C, limit " + p.tempLimitMax + " °C). Move to shade."]); } else if (p.tempLimitMin !== null && temp < p.tempLimitMin) { alerts.push(["alert", "🥶 Too cold for " + p.name + " (" + temp + " °C, limit " + p.tempLimitMin + " °C)."]); } else if (p.tempIdealMin !== null && p.tempIdealMax !== null && (temp < p.tempIdealMin || temp > p.tempIdealMax)) { alerts.push(["notice", "Temperature " + temp + " °C is outside the ideal range (" + p.tempIdealMin + " to " + p.tempIdealMax + " °C)."]); } } if (harvestAlert) alerts.push(["info", "🧺 " + harvestAlert]); if (alerts.length === 0) alerts.push(["info", "✅ No problems found."]); var ah = ""; alerts.forEach(function (a) { ah += "<div class='box " + a[0] + "'>" + a[1] + "</div>"; }); document.getElementById("alerts").innerHTML = ah; }) .catch(function () { document.getElementById("readings").innerHTML = "Could not read sensor data. Check that the channel is shared publicly."; }); } </script> </body> </html>
