<!DOCTYPE html> <html> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Smart Garden</title> <style> body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 15px; } label { display: block; margin-top: 12px; font-weight: bold; } input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; } button { margin-top: 18px; padding: 10px 16px; background: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 16px; } #result { margin-top: 20px; padding: 12px; background: #e8f5e9; border-radius: 6px; display: none; } #health { margin-top: 30px; display: none; border-top: 2px solid #ccc; padding-top: 10px; } #healthResult { margin-top: 15px; padding: 12px; background: #fff8e1; border-radius: 6px; display: none; } .best { font-size: 20px; font-weight: bold; color: #1b5e20; } .limits { font-size: 14px; color: #444; margin-top: 8px; } </style> </head> <body> <h1>Smart Garden 🌱</h1> <p>Tell us about your space.</p>

<label>Length (cm)</label>
<input type="number" id="length" placeholder="e.g. 150">

<label>Breadth (cm)</label>
<input type="number" id="breadth" placeholder="e.g. 60">

<label>Area type</label>
<select id="areaType">
<option value="balcony">Balcony</option>
<option value="rooftop">Rooftop</option>
<option value="indoor">Indoor</option>
</select>

<label>Sunlight per day (hours)</label>
<input type="number" id="sunHours" placeholder="e.g. 5">

<button onclick="recommend()">Get recommendation</button>

<div id="result"></div> <div id="health"> <h2>Plant health check</h2> <p>Type test sensor readings. Leave a box empty to skip it.</p>
<label>Soil moisture (%)</label>
<input type="number" id="moisture">

<label>Temperature (°C)</label>
<input type="number" id="temp">

<label>Humidity (%)</label>
<input type="number" id="humidity">

<label>Nitrogen N (mg/kg)</label>
<input type="number" id="n">

<label>Phosphorus P (mg/kg)</label>
<input type="number" id="p">

<label>Potassium K (mg/kg)</label>
<input type="number" id="k">

<button onclick="checkHealth()">Check plant health</button>
<div id="healthResult"></div>
</div> <script> var selectedPlant = null; function score(plant, input) { if (!plant.areaTypes.includes(input.areaType)) return -1; if (input.length * input.breadth < plant.minSpaceCm2) return -1; var s = 10; if (input.sunHours >= plant.sunHoursMin && input.sunHours <= plant.sunHoursMax) { s += 50; } else if (Math.abs(input.sunHours - plant.sunHoursMin) <= 1 || Math.abs(input.sunHours - plant.sunHoursMax) <= 1) { s += 25; } return s; } function recommend() { var input = { length: Number(document.getElementById("length").value), breadth: Number(document.getElementById("breadth").value), areaType: document.getElementById("areaType").value, sunHours: Number(document.getElementById("sunHours").value) }; fetch("plants.json") .then(function (r) { return r.json(); }) .then(function (plants) { var ranked = plants .map(function (p) { return { plant: p, score: score(p, input) }; }) .filter(function (x) { return x.score >= 0; }) .sort(function (a, b) { return b.score - a.score; }); var box = document.getElementById("result"); box.style.display = "block"; if (ranked.length === 0) { box.innerHTML = "No plant fits this space. Try a bigger area or a different area type."; document.getElementById("health").style.display = "none"; selectedPlant = null; return; } selectedPlant = ranked[0].plant; var p = selectedPlant; var html = "Best match:<br><span class='best'>" + p.name + "</span> (score " + ranked[0].score + ")"; html += "<div class='limits'>Care limits for this plant:<br>" + "Soil moisture: " + p.moistureMin + " to " + p.moistureMax + " %<br>" + "Temperature: " + p.tempMin + " to " + p.tempMax + " °C<br>" + "Humidity: " + p.humidityMin + " to " + p.humidityMax + " %<br>" + "Minimum N / P / K: " + p.nMin + " / " + p.pMin + " / " + p.kMin + "</div>"; if (ranked.length > 1) { html += "<br>Other options:<br>"; ranked.slice(1, 3).forEach(function (x) { html += x.plant.name + " (score " + x.score + ")<br>"; }); } box.innerHTML = html; document.getElementById("health").style.display = "block"; }) .catch(function () { document.getElementById("result").style.display = "block"; document.getElementById("result").innerHTML = "Could not load plants.json. Check the file name."; }); } function val(id) { var v = document.getElementById(id).value; return v === "" ? null : Number(v); } function checkHealth() { if (!selectedPlant) return; var p = selectedPlant; var msgs = []; var ledOn = false; var moisture = val("moisture"); var temp = val("temp"); var humidity = val("humidity"); var n = val("n"); var ph = val("p"); var k = val("k"); if (moisture !== null) { if (moisture < p.moistureMin) { msgs.push("💧 Watering needed"); ledOn = true; } else if (moisture > p.moistureMax) { msgs.push("💦 Soil too wet, stop watering"); } } if (temp !== null) { if (temp < p.tempMin) msgs.push("🥶 Too cold"); else if (temp > p.tempMax) msgs.push("🌡️ Too hot, move to shade"); } if (humidity !== null) { if (humidity < p.humidityMin) msgs.push("🏜️ Air too dry"); else if (humidity > p.humidityMax) msgs.push("☁️ Air too humid"); } if (n !== null && n < p.nMin) msgs.push("🌿 Nitrogen low"); if (ph !== null && ph < p.pMin) msgs.push("🌸 Phosphorus low"); if (k !== null && k < p.kMin) msgs.push("🍌 Potassium low"); var box = document.getElementById("healthResult"); box.style.display = "block"; if (msgs.length === 0) msgs.push("✅ Plant is healthy"); box.innerHTML = msgs.join("<br>") + "<br><br>Watering LED: " + (ledOn ? "ON" : "OFF"); } </script> </body> </html>
